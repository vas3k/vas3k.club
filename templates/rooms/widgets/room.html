<a href="{% url "feed_room" room.slug %}" class="room {% if type %}room-type-{{type}}{% endif %}" style="{% if room.style %}{{ room.style }}{% else %}background-color: {{ room.color }};{% endif %}">
    <span class="room-gradient"></span>
    <span class="room-icon-wrapper">
        <span class="room-icon"><img src="{{ room.image }}" alt="Иконка комнаты {{ room.title }}" loading="lazy" /></span>
    </span>
    <span class="room-name-wrapper">
        <span class="room-name">{{ room.title }}</span>
    </span>
</a>
