{% load static %}<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>{% if post.prefix %}{{ post.prefix }} {% endif %}{{ post.title }}</title>
    <style>
        @font-face {
            font-family: Ubuntu;
            src: url("{% static 'webfonts/Ubuntu-Medium.woff2' %}") format("woff2");
            font-weight: 500;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: Ubuntu, "Noto Color Emoji", "Apple Color Emoji", sans-serif;
            font-weight: 500;
            color: white;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            padding: 5.333333vw;
            background: white;
            overflow: hidden;
        }

            .background, .overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }

            .background {
                object-fit: cover;
                object-position: center;
            }

            .overlay {
                background: linear-gradient(rgba(0, 0, 0, 0.75), #000);
                opacity: 0.6;
            }

            .header {
                position: relative;
                display: flex;
                align-items: center;
                gap: 1.666667vw;
                min-width: 0;
                color: #e2e8f0;
                font-size: 2.333333vw;
            }

                .avatar {
                    width: 4vw;
                    height: 4vw;
                    border: 0.166667vw solid white;
                    border-radius: 50%;
                    object-fit: cover;
                }

                .author {
                    min-width: 0;
                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }

                .logo {
                    display: block;
                    width: 30%;
                    height: 3vw;
                    margin-left: auto;
                    object-fit: contain;
                    object-position: right center;
                    flex-shrink: 0;
                }

            .title {
                position: relative;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 5;
                overflow: hidden;
                overflow-wrap: anywhere;
                margin: 0;
                font-size: 5.775vw;
                font-weight: 500;
                line-height: 1.12;
            }
    </style>
</head>
<body>
    <main class="card">
        {% if background_url %}
            <img class="background" src="{{ background_url }}" alt="">
        {% endif %}
        <div class="overlay"></div>
        <header class="header">
            <img class="avatar" src="{{ post.author.get_avatar }}" alt="">
            <span class="author">{{ post.author.full_name }}</span>
            <img class="logo" src="{% static 'images/logo/logo-white-text.png' %}" alt="Вастрик.Клуб">
        </header>
        <h1 class="title">{% if post.prefix %}{{ post.prefix }} {% endif %}{{ post.title }}</h1>
    </main>
</body>
</html>
