map $uri $pepic_cache_control {
    default "public, max-age=31536000, immutable";
    / "no-store";
    ~^/(upload|jobs|meta)(/|$) "no-store";
    ~^/static/js/ "no-store";
}

map $uri $pepic_expires {
    default 1y;
    / off;
    ~^/(upload|jobs|meta)(/|$) off;
    ~^/static/js/ off;
}

server {
    listen 80;
    listen 443 ssl http2;

    server_name i.vas3k.club i.ru.vas3k.club;
    charset utf-8;
    client_max_body_size 100M;
    uwsgi_buffers 128 16k;
    real_ip_header X-Real-IP;

    ssl_certificate /home/vas3k/certs/pubkey.pem;
    ssl_certificate_key /home/vas3k/certs/privkey.pem;

    location / {
        add_header "Access-Control-Allow-Origin" "*";
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS";
        add_header "Access-Control-Allow-Headers" "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range";
        add_header "Access-Control-Expose-Headers" "Content-Length,Content-Range";

        expires $pepic_expires;
        add_header Cache-Control $pepic_cache_control;

        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;

        proxy_pass http://0.0.0.0:8118;
    }
}
