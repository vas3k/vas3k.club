[databases]
vas3k_club = host=127.0.0.1 port=5432 dbname=vas3k_club pool_size=30 reserve_pool_size=5 max_db_connections=35

vas3k_base = host=127.0.0.1 port=5432 dbname=vas3k_base pool_size=15 reserve_pool_size=3 max_db_connections=18
vas3k_events = host=127.0.0.1 port=5432 dbname=vas3k_events pool_size=8 reserve_pool_size=2 max_db_connections=10
taxhacker = host=127.0.0.1 port=5432 dbname=taxhacker pool_size=10 reserve_pool_size=2 max_db_connections=12

[pgbouncer]
listen_addr = 127.0.0.1,172.17.0.1
listen_port = 6432
unix_socket_dir = /var/run/postgresql
unix_socket_mode = 0770
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pool_admin
pool_mode = transaction
max_client_conn = 500
default_pool_size = 30
reserve_pool_size = 5
reserve_pool_timeout = 5
query_wait_timeout = 30
max_prepared_statements = 100
server_idle_timeout = 300
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
